<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        ::-webkit-scrollbar-corner {
            background: #181818;
        }

        ::-webkit-scrollbar-track {
            -webkit-box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            background-color: #303030;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6c6c6c;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #a1a1a1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-resizer {
            background: #828282;
            outline: 2px solid #b6b6b6;
        }

        body {
            background: #888;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            margin: 0;
        }

        .page {
            min-height: calc(100dvh - 16px);
            font-size: 40px;
            width: 360px;
            background: #bbb;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 25px;
            box-shadow: 0px 0px 20px rgb(0 0 0 / 50%);
        }

        * {
            font-family: "Comic Sans MS", 標楷體;
            box-sizing: border-box;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 43.6px;
            width: 43.6px;
            padding: 5px;
            margin: 10px 0;
            background-color: #fff5;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0px 4px 32px 0 rgba(0, 0, 0, 0.15);
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.2s ease;
        }

        .website-card {
            display: flex;
            align-items: center;
            height: 53.6px;
            width: 100%;
            font-size: 20px;
            padding: 10px;
            margin: 8px 0;
            background-color: #fff5;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0px 4px 32px 0 rgba(0, 0, 0, 0.15);
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            transition: background-color 0.2s ease, transform 0.2s ease;
            flex-direction: row;
        }

        @media (hover: hover) {

            .website-card:hover,
            .link-card:hover {
                background-color: #27272a;
                transform: translateY(-2px);
            }
        }

        .link-card .icon {
            fill: currentColor;
        }

        .link-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .website-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            margin-top: 30px;
            margin-bottom: 10px;
            width: 271.6px;
            height: 100%;
        }

        .website-icon {
            fill: currentColor;
            margin-right: 10px;
        }

        .website-detail {
            display: flex;
            align-items: center;
            justify-content: center;
        }


        .profile-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            object-position: center;
            border-radius: 50%;
            margin: 45px 0 30px 0;
            flex-shrink: 0;
        }

        .username {
            font-size: 25px;
            font-weight: 300;
            color: #ffffff;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5),
                0 0 20px rgba(255, 255, 255, 0.3);
        }

        .footer {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
    </style>
</head>
